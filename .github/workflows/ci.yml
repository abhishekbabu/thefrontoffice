name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep uv from picking a different interpreter than pyproject asks for.
  UV_PYTHON_PREFERENCE: only-managed
# setup-uv takes its version from `[tool.uv] required-version` in pyproject.toml
# when none is given here — the first uv that can fetch Python 3.15.0 — so the
# floor lives in one place.

jobs:
  check:
    name: check (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not incidental here: the tooling calls everything through
        # `uv run` and the app handles cp1252 consoles and the yahoofantasy.exe
        # probe specifically so it works there. This job is what proves it.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Python 3.15 is required, so it is the only interpreter there is to
        # test: requires-python, .python-version and the pyrefly and ruff
        # targets all say 3.15.
        python: ["3.15"]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --locked fails if uv.lock is stale relative to pyproject.toml, so a
        # dependency change that skipped `just lock` cannot land.
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Lint and format check
        run: uvx --from rust-just just lint

      - name: Type check
        run: uvx --from rust-just just typecheck

      - name: Tests and coverage floor
        run: uvx --from rust-just just coverage-gate

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          # Read from web/package.json's packageManager field, so the version
          # here cannot drift from the one the lockfile was resolved with.
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        # --frozen-lockfile fails if the lockfile is stale relative to
        # package.json, matching what `uv sync --locked` does for Python.
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Lint, type check, test and build
        # One recipe rather than four steps, so adding a gate to the justfile
        # extends CI the way it already does for Python. Listing them here
        # separately is how the bundle budget came to run in CI and not
        # locally: `just check-web` passed on a change this job then rejected.
        # The install above already ran with --frozen-lockfile, so the one
        # inside the recipe is a no-op.
        run: uvx --from rust-just just check-web

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked

      - name: Pre-commit hooks
        # The lint/type/test hooks already run in `check` across three
        # platforms; this covers the rest — whitespace, EOF, merge markers,
        # large files, and the private-key scan.
        env:
          # no-commit-to-branch is a local guardrail against committing straight
          # to main; by the time CI runs, the commit exists and the check would
          # fail every push to main. The rest each have a job of their own —
          # eslint runs in `web`, which is the one with pnpm on it.
          SKIP: no-commit-to-branch,ruff,ruff-format,pyrefly,pytest,eslint
        run: uv run pre-commit run --all-files --show-diff-on-failure
