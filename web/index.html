<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Front Office</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
    <script>
      // Runs before first paint so the page never shows a light frame on its way
      // to dark. Reads the same keys useTheme writes; a stored mode wins over the
      // OS, and anything unreadable falls back to the OS rather than throwing.
      (function () {
        try {
          var mode = localStorage.getItem("tfo:mode");
          var dark = mode ? mode === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          var palette = localStorage.getItem("tfo:palette");
          if (palette && palette !== "vercel") document.documentElement.setAttribute("data-theme", palette);
        } catch (e) {
          /* storage blocked; the light default stands */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
