# Turns the "Code Quality Checklist" in .agent/rules/rules.md into enforcement.
# Install once: uv run pre-commit install
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: no-commit-to-branch
            args: [--branch, main]
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: check-added-large-files
          - id: check-merge-conflict
          - id: detect-private-key

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.15
      hooks:
          - id: ruff
            args: ["--fix", "--show-fixes"]
            types: [python]
          - id: ruff-format
            types: [python]

    - repo: local
      hooks:
          - id: pyrefly
            name: pyrefly type check
            language: system
            entry: uv run pyrefly
            args: ["check"]
            pass_filenames: false
            files: ^(src|scripts)/.*\.py$
            types: [python]

          - id: agent-docs
            name: agent documentation conventions
            language: system
            entry: uv run python scripts/check_agent_docs.py
            pass_filenames: false
            files: (AGENTS\.md|CLAUDE\.md|\.agents/|scripts/check_agent_docs\.py)$

          - id: eslint
            name: eslint (front end)
            language: system
            # The whole tree rather than the staged files: it takes under two
            # seconds, and the config lives in web/ so a path relative to the
            # repo root would not resolve against it.
            # Through just, which runs it from inside web/: started from the
            # repo root, corepack ignores web/'s pnpm pin and a newer default
            # refuses to run there at all.
            entry: just lint-web
            pass_filenames: false
            files: ^web/(src/.*\.tsx?|eslint\.config\.js|package\.json)$

          - id: pytest
            name: pytest (hermetic suite)
            language: system
            entry: uv run pytest
            args: ["-q"]
            pass_filenames: false
            files: ^(src|tests|scripts)/.*\.py$
            types: [python]
