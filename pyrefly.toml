# Type checking config — replaces mypy.ini.
python-version = "3.15"
project-includes = ["src", "scripts", "tests"]
# tests/ is on the path so `from conftest import ...` resolves the shared fakes;
# scripts/ so the agent-docs checker resolves the same way pytest sees it.
search-path = ["src", "tests", "scripts"]
project-excludes = [
    "**/__pycache__/**",
    "**/.venv/**",
]

[errors]
# yahoofantasy's League/Player/Team attributes are assigned at runtime by
# `from_response_object`, which setattr()s each key of the API response onto the
# object. No static analyser can see `player.name.full` or `team.roster_adds`,
# so this category is pure noise wherever those SDK types are handled. mypy hid
# the same thing behind `ignore_missing_imports` in mypy.ini.
# It is re-enabled below for every module that does NOT touch the SDK.
missing-attribute = false

# Modules with no yahoofantasy import: hold them to the full bar so a genuine
# typo or bad attribute access still fails the check.
[[sub-config]]
matches = "src/thefrontoffice/config/**"
[sub-config.errors]
missing-attribute = true

[[sub-config]]
matches = "src/thefrontoffice/clients/nba/**"
[sub-config.errors]
missing-attribute = true

[[sub-config]]
matches = "src/thefrontoffice/clients/gemini/**"
[sub-config.errors]
missing-attribute = true
