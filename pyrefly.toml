# Type checking config.
python-version = "3.15"
project-includes = ["src", "scripts", "tests"]
# tests/ is on the path so `from support... import ...` resolves the shared fakes;
# scripts/ so the agent-docs checker resolves the same way pytest sees it.
search-path = ["src", "tests", "scripts"]
project-excludes = [
    "**/__pycache__/**",
    "**/.venv/**",
]

# yahoofantasy ships no types, and its classes get their attributes at runtime:
# `from_response_object` setattr()s each key of the API response onto the
# object, so `player.name.full` or `team.roster_adds` exist on no class. Read
# as Any, which is what it is, rather than as classes that claim to know.
replace-imports-with-any = ["yahoofantasy", "yahoofantasy.*"]

[errors]
# On everywhere, so a typo'd attribute or an unchecked Optional fails the check.
missing-attribute = true
