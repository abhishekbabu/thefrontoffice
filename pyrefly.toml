# Type checking config.
python-version = "3.15"
project-includes = ["src", "scripts", "tests"]
# tests/ is on the path so `from conftest import ...` resolves the shared fakes;
# scripts/ so the agent-docs checker resolves the same way pytest sees it.
search-path = ["src", "tests", "scripts"]
project-excludes = [
    "**/__pycache__/**",
    "**/.venv/**",
]

[errors]
# On everywhere, so a typo'd attribute or an unchecked Optional fails the check.
missing-attribute = true

# Off only where the yahoofantasy SDK is handled. Its League/Player/Team
# attributes are assigned at runtime by `from_response_object`, which setattr()s
# each key of the API response onto the object, so no static analyser can see
# `player.name.full` or `team.roster_adds` and every access would be an error.
[[sub-config]]
matches = "src/thefrontoffice/adapters/outbound/platforms/yahoo/**"
[sub-config.errors]
missing-attribute = false

[[sub-config]]
matches = "src/thefrontoffice/adapters/outbound/competitions/nba/**"
[sub-config.errors]
missing-attribute = false

[[sub-config]]
matches = "tests/test_yahoo_client.py"
[sub-config.errors]
missing-attribute = false
