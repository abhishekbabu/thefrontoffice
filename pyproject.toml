[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thefrontoffice"
version = "0.1.0"
description = "All-In-One NBA Fantasy Intelligence — AI-powered General Manager"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "yahoofantasy>=1.4.9,<2",
    # Imported directly by config/settings.py; pulled in by pydantic-settings
    # too, but a direct import belongs in direct dependencies.
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "google-genai>=2.33.0,<3",
    # Groq and OpenRouter, which both speak the OpenAI wire format.
    "openai>=3.37.0,<4",
    # The platform clients catch requests' exception types by name to decide
    # what is retryable, so it is a direct dependency rather than something
    # inherited from whatever else happens to pull it in.
    "requests>=2.32.0,<3",
    "tenacity>=9.1.4,<10",
    # Telemetry. Inert without LOGFIRE_TOKEN, so a fresh clone and the test
    # suite never reach the network because it is installed. The extras are the
    # two instrumentations config/telemetry.py enables; without them logfire
    # imports fine and then raises at instrument_* time.
    "logfire[google-genai,requests]>=5.3.0,<6",
    "fastapi>=0.162.0,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pyreadline3>=3.4,<4; sys_platform == 'win32'",
    # zoneinfo reads the OS tz database, which Windows does not ship. Without
    # this, ZoneInfo("America/Los_Angeles") raises ZoneInfoNotFoundError there.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
front-office = "thefrontoffice.adapters.inbound.cli.repl:main"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0,<2",
    "pytest>=8.0.0,<10",
    "pytest-cov>=6.0.0,<8",
    "ruff>=0.17.2,<1",
    "pre-commit>=4.7.0,<5",
    # starlette's TestClient deprecated the httpx 0.x backend; httpx2 is what it wants now.
    "httpx2>=2.16.0,<3",
]

[tool.uv]
# The first uv that can fetch Python 3.15.0: an older one fails to find an
# interpreter at all, which reads like a broken machine rather than an old tool.
required-version = ">=0.13.5"

[tool.setuptools.packages.find]
where = ["src"]
include = ["thefrontoffice*"]
namespaces = false

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (includes F401 unused imports)
    "I",      # isort — enforces the stdlib/third-party/local grouping in rules.md
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "TID252", # ban relative imports
    "DTZ",    # naive datetimes — AGENTS.md: store aware UTC, basketball anchors to PACIFIC
    "T20",    # print — AGENTS.md: never outside adapters/inbound/, which render to a person
]
ignore = [
    "E501",  # line too long — handled by ruff format
    "TC001", # move first-party import into TYPE_CHECKING
    "TC002", # move third-party import into TYPE_CHECKING
    "TC003", # move stdlib import into TYPE_CHECKING
]

[tool.ruff.lint.per-file-ignores]
# The two places output is the job: the inbound adapters render to a person, and
# scripts/ are command-line tools. A print anywhere else is a library talking
# over whatever called it.
"src/thefrontoffice/adapters/inbound/**" = ["T20"]
"scripts/**" = ["T20"]
"tests/adapters/inbound/cli/test_console.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["thefrontoffice"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Match .gitattributes (eol=lf) instead of inferring per file, so a Windows
# checkout cannot produce a diff that only changes line endings.
line-ending = "lf"


[tool.coverage.run]
source = ["thefrontoffice"]
omit = [
    # Presentation shells: exercised by hand, not worth mocking a terminal or
    # a Streamlit runtime for. The logic they call is covered directly.
    "*/adapters/inbound/cli/repl.py",
    "*/adapters/inbound/cli/output.py",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
skip_empty = true
show_missing = true
precision = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The suite mirrors the source tree, so several directories hold a `test_week.py`
# or a `test_client.py`: importlib mode imports each by its path rather than as a
# top-level module of that name, which would collide. `tests/` on the path keeps
# `from conftest import ...` and `from reports import ...` resolving from any depth.
pythonpath = ["tests"]
markers = [
    "integration: hits a live external API (Yahoo, NBA.com or Gemini). Deselected by default; opt in with `-m integration`.",
]
# Default run is hermetic and fast — no network, no credentials required.
addopts = "-m 'not integration' --import-mode=importlib"
